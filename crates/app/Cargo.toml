[package]
name = "fullpad"
version = "4.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Brennon-Oliveira/fullpad"

[dependencies]
fullpad-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
uuid = "1.29.0"

[features]
# Build de desenvolvimento: outra pasta de dados (`fullpad-dev`), sem atalho global nem atualização automática e com
# a marca "DEV" na tela. Combina com `TAURI_CONFIG` de `tauri.dev.conf.json` (outro identificador e ícone vermelho).
# O instalador e a skill `gerar-versao` nunca ligam isto. Ver docs/rules/build-dev.md.
dev-build = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
