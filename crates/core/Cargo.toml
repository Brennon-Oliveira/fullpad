[package]
name = "fullpad-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
base64 = "0.22"
dirs = "7.0.0"
encoding_rs = "0.8.44"
flate2 = "1.1.10"
quick-xml = "0.37"
regex = "1.13.1"
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.17"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }
