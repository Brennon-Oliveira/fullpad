name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependências do Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config build-essential

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo test -p fullpad-core

      - name: Build do app
        working-directory: crates/app
        run: cargo tauri build --ci ${{ matrix.os == 'windows-latest' && '--bundles nsis' || '--bundles deb' }}

      - name: Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fullpad-windows
          path: |
            target/release/fullpad.exe
            target/release/bundle/nsis/*.exe

      - name: Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fullpad-linux
          path: |
            target/release/fullpad
            target/release/bundle/deb/*.deb
